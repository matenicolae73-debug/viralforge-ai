name: Unpack ViralMovie V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    name: Unpack ViralMovie ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Check exact ZIP name
        shell: bash
        run: |
          set -e

          ZIP_FILE="./ViralMovie-AI-V4-FIXED(5)-renamed.zip"

          echo "Caut fisierul:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "EROARE: ZIP-ul nu exista."

            echo "ZIP-uri gasite in repository:"
            find . -type f -iname "*.zip"

            exit 1
          fi

          echo "ZIP gasit cu succes."

      - name: Unpack exact ViralMovie ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./ViralMovie-AI-V4-FIXED(5)-renamed.zip"
          TEMP_DIR="./unpacked-viralmovie"

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          unzip -o "$ZIP_FILE" -d "$TEMP_DIR"

          echo "Dezarhivare finalizata."

      - name: Find project folder
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find ./unpacked-viralmovie \
            -name package.json \
            -not -path "*/node_modules/*" \
            -printf "%h\n" \
            | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json nu a fost gasit."
            echo "Se foloseste folderul extras."

            PROJECT_DIR="./unpacked-viralmovie"
          fi

          echo "Folder proiect: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Copy project to repository root
        shell: bash
        run: |
          set -e

          shopt -s dotglob nullglob

          echo "Se copiaza proiectul..."

          for FILE in "$PROJECT_DIR"/*; do
            NAME="$(basename "$FILE")"

            if [ "$NAME" = "node_modules" ]; then
              continue
            fi

            if [ "$NAME" = ".next" ]; then
              continue
            fi

            if [ "$NAME" = ".git" ]; then
              continue
            fi

            if [ "$NAME" = "*.zip" ]; then
              continue
            fi

            cp -R "$FILE" .
          done

          echo "Proiect copiat cu succes."

      - name: Remove temporary folder
        shell: bash
        run: |
          set -e

          rm -rf ./unpacked-viralmovie

          echo "Folder temporar sters."

      - name: Remove ZIP after unpack
        shell: bash
        run: |
          set -e

          rm -f "./ViralMovie-AI-V4-FIXED(5)-renamed.zip"

          echo "ZIP sters dupa dezarhivare."

      - name: Commit and push unpacked project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu exista modificari noi."
            exit 0
          fi

          git commit -m "Unpack ViralMovie V4 project"
          git push
