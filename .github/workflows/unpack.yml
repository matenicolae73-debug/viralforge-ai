name: Install ViralForge project

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "viralforge-ai-magichour.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          ls -la
          test -f viralforge-ai-magichour.zip

      - name: Extract project
        run: |
          mkdir -p /tmp/viralforge
          unzip -q viralforge-ai-magichour.zip -d /tmp/viralforge

          find /tmp/viralforge -mindepth 1 -maxdepth 1 -type d -print

          rm -rf app components lib public
          rm -f package.json next.config.mjs tsconfig.json postcss.config.mjs components.json pnpm-lock.yaml pnpm-workspace.yaml

          cp -a /tmp/viralforge/. .

          rm -f viralforge-ai-magichour.zip

      - name: Show project files
        run: |
          echo "=== PROJECT ==="
          ls -la
          echo "=== APP ==="
          find app -maxdepth 2 -type f | sort | head -100

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Install ViralForge AI project"
          git push
