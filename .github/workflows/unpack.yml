name: ViralMovie AI - AUTO UNPACK

on:
  workflow_dispatch:
  push:
    paths:
      - "ViralMovie-AI-AUTO-UNPACK.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ViralMovie ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -iname 'ViralMovie-AI-AUTO-UNPACK.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: ViralMovie-AI-AUTO-UNPACK.zip not found."
            echo "ZIP files found:"
            find . -maxdepth 1 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ViralMovie project
        shell: bash
        run: |
          set -e

          ZIP="${{ steps.zip.outputs.ZIP }}"

          rm -rf .unpack-temp
          mkdir -p .unpack-temp

          unzip -o "$ZIP" -d .unpack-temp

          echo "Extracted files:"
          find .unpack-temp -maxdepth 3 -type f | head -100

      - name: Find project root
        id: project
        shell: bash
        run: |
          set -e

          ROOT=".unpack-temp"

          if [ -f "$ROOT/package.json" ]; then
            echo "package.json found at ZIP root."
          else
            PKG="$(find "$ROOT" -type f -name package.json -print -quit)"

            if [ -z "$PKG" ]; then
              echo "ERROR: package.json not found."
              exit 1
            fi

            ROOT="$(dirname "$PKG")"
          fi

          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Install ViralMovie project at repository root
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.project.outputs.ROOT }}"
          ZIP="${{ steps.zip.outputs.ZIP }}"

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name ".unpack-temp" \
            ! -name "$(basename "$ZIP")" \
            -exec rm -rf {} +

          rsync -a --exclude=".github/" "$ROOT"/ ./

          rm -rf .unpack-temp
          rm -f "$ZIP"

          if [ ! -f package.json ]; then
            echo "ERROR: package.json missing after unpack."
            exit 1
          fi

          echo "ViralMovie AI UNPACK OK"

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "AUTO UNPACK ViralMovie AI"
            git push
          fi
