name: Unpack ViralMovie ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/unpack.yml"

permissions:
  contents: write

jobs:
  unpack:
    name: Unpack ViralMovie project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find ViralMovie ZIP
        shell: bash
        run: |
          set -e

          echo "Caut fisierul ZIP..."

          ZIP_FILE="$(find . \
            -type f \
            -iname '*.zip' \
            -not -path './.git/*' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Niciun fisier ZIP nu a fost gasit."
            echo ""
            echo "Fisierele gasite in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP gasit: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Show ZIP information
        shell: bash
        run: |
          set -e

          echo "ZIP selectat:"
          echo "$ZIP_FILE"

          echo ""
          echo "Continutul ZIP-ului:"
          unzip -l "$ZIP_FILE"

      - name: Extract ViralMovie project
        shell: bash
        run: |
          set -e

          rm -rf extracted-viralmovie
          mkdir -p extracted-viralmovie

          echo "Se dezarhiveaza proiectul..."

          unzip -o "$ZIP_FILE" \
            -d extracted-viralmovie

          echo ""
          echo "ZIP dezarhivat cu succes."

      - name: Find project root
        shell: bash
        run: |
          set -e

          echo "Se cauta package.json..."

          PROJECT_ROOT="$(find extracted-viralmovie \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -printf '%h\n' \
            | head -n 1)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "package.json nu a fost gasit."
            echo "Se foloseste folderul principal extras."

            PROJECT_ROOT="extracted-viralmovie"
          fi

          echo "Project root: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Display extracted files
        shell: bash
        run: |
          set -e

          echo "Fisierele proiectului:"

          find "$PROJECT_ROOT" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -n 150

      - name: Skip npm install during unpack
        shell: bash
        run: |
          set -e

          echo "Se sare peste npm install."
          echo "Acest workflow doar dezarhiveaza proiectul."
          echo "Dependentele vor fi instalate ulterior pe Vercel sau local."

      - name: Check project files
        shell: bash
        run: |
          set -e

          echo "Verificare fisiere proiect..."

          if [ -f "$PROJECT_ROOT/package.json" ]; then
            echo "package.json gasit."
          else
            echo "WARNING: package.json nu a fost gasit."
          fi

          if [ -f "$PROJECT_ROOT/next.config.ts" ]; then
            echo "next.config.ts gasit."
          fi

          if [ -d "$PROJECT_ROOT/app" ]; then
            echo "Folderul app/ exista."
          fi

          if [ -d "$PROJECT_ROOT/pages" ]; then
            echo "Folderul pages/ exista."
          fi

          echo "Verificarea s-a terminat."

      - name: Copy extracted project to repository root
        shell: bash
        run: |
          set -e

          echo "Se copiaza proiectul in repository..."

          shopt -s dotglob nullglob

          for item in "$PROJECT_ROOT"/*; do
            item_name="$(basename "$item")"

            if [ "$item_name" = "node_modules" ]; then
              echo "Se ignora node_modules."
              continue
            fi

            if [ "$item_name" = ".next" ]; then
              echo "Se ignora .next."
              continue
            fi

            if [ "$item_name" = ".git" ]; then
              echo "Se ignora .git."
              continue
            fi

            if [ "$item_name" = "*.zip" ]; then
              echo "Se ignora ZIP-ul."
              continue
            fi

            echo "Copiez: $item_name"
            cp -R "$item" .
          done

          echo "Copiere finalizata."

      - name: Remove temporary extraction folder
        shell: bash
        run: |
          set -e

          rm -rf extracted-viralmovie

          echo "Folderul temporar a fost sters."

      - name: Remove ZIP archive
        shell: bash
        run: |
          set -e

          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            rm -f "$ZIP_FILE"
            echo "ZIP-ul a fost eliminat din repository."
          else
            echo "ZIP-ul nu mai exista."
          fi

      - name: Show final project structure
        shell: bash
        run: |
          set -e

          echo "Structura finala:"

          find . \
            -maxdepth 3 \
            -type f \
            -not -path './.git/*' \
            | sort \
            | head -n 200

      - name: Commit and push changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nu exista modificari noi."
            exit 0
          fi

          git commit -m "Unpack ViralMovie project"

          git push
